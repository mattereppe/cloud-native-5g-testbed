apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-amf-config
  namespace: $K8S_NAMESPACE
  labels:
    epc-role: amf
data:
  amf.yaml: |
    logger:
        file: /var/log/open5gs/amf.log
    sbi:
        server:
          no_tls: true
        client:
          no_tls: true
    amf:
        sbi:
          - addr: $AMF_POD_IP
            port: 7777
        ngap:
          - addr: $AMF_POD_IP
        guami:
          - plmn_id:
              mcc: $OPEN5GS_MCC
              mnc: $OPEN5GS_MNC
            amf_id:
              region: $OPEN5GS_REGION
              set: $OPEN5GS_SET
        tai:
          - plmn_id:
              mcc: $OPEN5GS_MCC
              mnc: $OPEN5GS_MNC
            tac: $OPEN5GS_TAC
        plmn_support:
          - plmn_id:
              mcc: $OPEN5GS_MCC
              mnc: $OPEN5GS_MNC
            s_nssai:
              - sst: $OPEN5GS_SST
        security:
            integrity_order : [ NIA2, NIA1, NIA0 ]
            ciphering_order : [ NEA0, NEA1, NEA2 ]
        network_name:
            full: $OPEN5GS_NETNAME
        amf_name: open5gs-amf0
    
    nrf:
        sbi:
          - addr:
              - nrf.$K8S_NAMESPACE.svc.$K8S_DOMAIN
            port: 7777
