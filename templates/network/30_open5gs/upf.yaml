apiVersion: v1
kind: Service
metadata:
  name: upf
  namespace: $K8S_NAMESPACE
  labels:
    epc-role: upf
spec:
  type: NodePort
  ports:
  - name: pfcp      # Packet Forwarding Control Protocol (SDN-like packet forwarding rules)
    port: 8805
    protocol: UDP    
  - name: gtpu   # GPRS Tunnelling Protocol - User data tunneling
    port: 2152
    protocol: UDP
  - name: openc2  # OpenC2 MIRANDA connector
    port: 8080
    protocol: TCP
    nodePort: 30180
  selector:
    epc-role: upf    
---
apiVersion: apps/v1 
kind: StatefulSet
metadata:
  name: upf
  namespace: $K8S_NAMESPACE
  labels:
    segment: core
    plane: user
spec:
  replicas: 1
  serviceName: "upf"
  selector:
    matchLabels:
      epc-role: upf
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: '[
           { 
              "name": "datanetwork1",
              "ips": [ "$NETADDR_UEGW" ]
           }
        ]'
      labels:
        epc-role: upf
    spec:
      initContainers:
        - name: replace-env-variables
          image: bhgedigital/envsubst
          command: ["/bin/sh","-c","cat /tmp/upf.yaml | envsubst > /etc/open5gs/upf.yaml"]
          volumeMounts:
            - name: upf-configmap-volume
              mountPath: /tmp/
            - name: upf-data-volume
              mountPath: /etc/open5gs/
          env:
            - name: UPF_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
        - name: replace-env-variables-connector
          image: bhgedigital/envsubst
          command: ["/bin/sh","-c","cat /tmp/connector.yaml | envsubst > /config/connector.yaml"]
          volumeMounts:
            - name: connector-configmap-volume
              mountPath: /tmp/
            - name: connector-config-volume
              mountPath: /config
          env:
            - name: CONNECTOR_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
      containers:
        - name: upf
          image: $IMAGE_REPO/open5gs:$CN5T_RELEASE
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
          imagePullPolicy: Always
#          command: ["open5gs-upfd", "-c", "/etc/open5gs/upf.yaml"]
          command: ["/bin/sh", "-c"]
# TODO: Enable natting
          args:
            - echo "1" > /proc/sys/net/ipv4/ip_forward;
              ip tuntap add name ogstun mode tun;
              ip addr add 10.45.0.1/16 dev ogstun;
              ip link set ogstun up; 
              open5gs-upfd -c /etc/open5gs/upf.yaml				  
          volumeMounts:
          - name: upf-data-volume
            mountPath: /etc/open5gs
          - name: dev-net-tun
            mountPath: /dev/net/tun
        - name: miranda-connector
          image: $IMAGE_REPO/connector:$CONNECTOR_RELEASE
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
          imagePullPolicy: Always
          command: ["python3", "connector.py", "-c", "/config/connector.yaml"]
#          command: ["/bin/bash", "-c", "sleep 36000"]
          volumeMounts:
          - name: connector-config-volume
            mountPath: /config
          - name: connector-data-volume
            mountPath: /data
          - name: nfm-fprobe-volume
            mountPath: /actuators-config/nfm-fprobe.yaml
            subPath: nfm-fprobe.yaml
          - name: nfm-packetbeat-volume
            mountPath: /actuators-config/nfm-packetbeat.yaml
            subPath: nfm-packetbeat.yaml
      volumes:
# Open5GS UPF volumens
        - name: upf-configmap-volume
          configMap:
            name: open5gs-upf-config
        - name: upf-data-volume
          emptyDir: {}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
# MIRANDA Connector volumes 
        - name: connector-configmap-volume
          configMap:
            name: connector-config
        - name: connector-config-volume
          emptyDir: {}
        - name: connector-data-volume
          emptyDir: {}
        - name: nfm-fprobe-volume
          configMap:
            name: nfm-config-fprobe
        - name: nfm-packetbeat-volume
          configMap:
            name: nfm-config-packetbeat
